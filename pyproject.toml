[project]
name = "spf-validator"
version = "1.4.0"
description = "Validates Sender Policy Framework (SPF) strings to ensure they are formatted correctly."
authors = [
    {name = "Frank Corso", email = "frank@frankcorso.me"}
]
readme = "README.md"
license = {text = "MIT License"}
requires-python = ">=3.10"
keywords = ["spf", "sender policy framework", "email"]
dependencies = [
    "dnspython>=2.5,<2.9"
]

[project.urls]
Homepage = "https://github.com/fpcorso/spf-validator"
Documentation = "https://github.com/fpcorso/spf-validator#usage"
Repository = "https://github.com/fpcorso/spf-validator"

[tool.poetry]
packages = [{include = "spf_validator", from = "src"}]

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.0"

[tool.poetry.group.test.dependencies]
pytest = "^8.3.4"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "RUF",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
